<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SUNO 가사 다운로더 — 환경설정</title>
    <link rel="stylesheet" href="popup.css">
    <link rel="stylesheet" href="options.css">
  </head>
  <body class="options-body">
    <main class="options-shell">
      <header class="options-header">
        <div>
          <strong data-i18n="prefs.pageTitle">환경설정</strong>
          <span data-i18n="header.subtitle">썸네일 다운로드 버튼 기본값</span>
        </div>
      </header>

      <section class="options-card">
        <div class="options-card-title">
          <strong data-i18n="prefs.language">언어 / Language</strong>
          <p data-i18n="prefs.languageHint">팝업과 옵션 페이지의 표시 언어를 선택하세요. 설정은 자동 저장됩니다.</p>
        </div>
        <div class="lang-toggle" role="group" aria-label="Language">
          <button type="button" data-lang="ko" aria-pressed="true">KO</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
          <button type="button" data-lang="ja" aria-pressed="false">JA</button>
          <button type="button" data-lang="zh" aria-pressed="false">ZH</button>
          <button type="button" data-lang="es" aria-pressed="false">ES</button>
        </div>
      </section>

      <section class="options-card">
        <div class="options-card-title">
          <strong data-i18n="prefs.theme">테마</strong>
          <p data-i18n="prefs.themeHint">라이트, 다크, 또는 시스템 설정을 따릅니다.</p>
        </div>
        <div class="theme-toggle" role="group" aria-label="Theme">
          <button type="button" data-theme-choice="system" aria-pressed="true" data-i18n="theme.system">시스템</button>
          <button type="button" data-theme-choice="light" aria-pressed="false" data-i18n="theme.light">라이트</button>
          <button type="button" data-theme-choice="dark" aria-pressed="false" data-i18n="theme.dark">다크</button>
        </div>
      </section>

      <section class="options-card">
        <div class="options-card-title">
          <strong data-i18n="prefs.shortcut.title">단축키</strong>
          <p data-i18n="prefs.shortcut.hint">Suno 곡 페이지에서 즉시 다운로드. 다른 단축키와 충돌하면 직접 변경할 수 있습니다.</p>
        </div>
        <div class="shortcut-row">
          <span class="shortcut-label" data-i18n="prefs.shortcut.current">현재 단축키</span>
          <kbd class="shortcut-keys" data-role="shortcut-current">—</kbd>
          <button type="button" class="shortcut-change-btn" data-action="open-shortcuts" data-i18n="prefs.shortcut.change">단축키 변경 →</button>
        </div>
      </section>

      <section class="options-card">
        <div class="options-card-title">
          <strong data-i18n="prefs.contact.title">개발자 1:1 문의</strong>
          <p data-i18n="prefs.contact.hint">버그 제보, 기능 제안, 사용 문의는 카카오톡으로 직접 연락주세요.</p>
        </div>
        <a class="contact-cta" href="https://open.kakao.com/me/playlistforge" target="_blank" rel="noopener noreferrer">
          <span class="contact-cta-badge" aria-hidden="true">
            <img src="icons/brand/kakaotalk.svg" alt="">
          </span>
          <span class="contact-cta-text" data-i18n="prefs.contact.cta">카카오톡으로 문의하기</span>
          <span class="contact-cta-arrow" aria-hidden="true">↗</span>
        </a>
        <p class="contact-email">
          <span data-i18n="prefs.contact.emailHint">이메일도 가능:</span>
          <a href="mailto:Reu0691@kakao.com">Reu0691@kakao.com</a>
        </p>
      </section>

      <section class="options-card options-card-about">
        <div class="options-card-title">
          <strong data-i18n="prefs.about.title">정보</strong>
        </div>
        <div class="about-row">
          <span class="about-label" data-i18n="prefs.about.version">버전</span>
          <span class="about-version" data-role="about-version">—</span>
          <a class="about-link" href="https://github.com/Johau91/suno-caption-studio/releases" target="_blank" rel="noopener noreferrer" data-i18n="prefs.about.releases">변경 사항 보기 →</a>
        </div>
      </section>
    </main>
    <script src="i18n.js"></script>
    <script src="options.js"></script>
  </body>
</html>
