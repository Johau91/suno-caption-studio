<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SUNO 가사 다운로더</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="popup-header">
        <div>
          <strong data-i18n="header.title">가사 다운로드 설정</strong>
          <span data-i18n="header.subtitle">썸네일 다운로드 버튼 기본값</span>
        </div>
        <div class="popup-header-actions">
          <button type="button" class="header-icon-btn header-icon-btn-brand" data-action="open-suno"
            data-i18n-tooltip="header.openSuno" data-i18n-aria-label="header.openSuno"
            data-tooltip="Suno 열기" aria-label="Suno 열기">
            <img class="header-brand-img" src="icons/suno.png" alt="" aria-hidden="true">
          </button>
          <div class="share-wrap">
            <button type="button" class="header-icon-btn" data-action="toggle-share"
              aria-haspopup="true" aria-expanded="false" aria-controls="share-popover"
              data-i18n-tooltip="tooltip.share" data-i18n-aria-label="share.title"
              data-tooltip="공유" aria-label="친구에게 공유">
              <span class="header-icon header-icon-share" aria-hidden="true"></span>
            </button>
            <div class="share-popover" id="share-popover" data-role="share-popover" role="menu" hidden>
              <p class="share-popover-title" data-i18n="share.menu.title">어디로 공유할까요?</p>
              <button type="button" class="share-option" data-share="copy" role="menuitem">
                <span class="share-option-badge share-badge-copy" aria-hidden="true"></span>
                <span class="share-option-label" data-i18n="share.option.copy">링크 복사</span>
              </button>
              <button type="button" class="share-option" data-share="kakao" role="menuitem">
                <span class="share-option-badge share-badge-kakao" aria-hidden="true">
                  <img src="icons/brand/kakaotalk.svg" alt="">
                </span>
                <span class="share-option-label" data-i18n="share.option.kakao">카카오톡</span>
              </button>
              <button type="button" class="share-option" data-share="discord" role="menuitem">
                <span class="share-option-badge share-badge-discord" aria-hidden="true"></span>
                <span class="share-option-label" data-i18n="share.option.discord">디스코드</span>
              </button>
              <button type="button" class="share-option" data-share="x" role="menuitem">
                <span class="share-option-badge share-badge-x" aria-hidden="true"></span>
                <span class="share-option-label" data-i18n="share.option.x">X (Twitter)</span>
              </button>
              <button type="button" class="share-option" data-share="threads" role="menuitem">
                <span class="share-option-badge share-badge-threads" aria-hidden="true"></span>
                <span class="share-option-label" data-i18n="share.option.threads">쓰레드</span>
              </button>
              <button type="button" class="share-option" data-share="naver-blog" role="menuitem">
                <span class="share-option-badge share-badge-naver" aria-hidden="true"></span>
                <span class="share-option-label" data-i18n="share.option.naverBlog">네이버 블로그</span>
              </button>
              <button type="button" class="share-option" data-share="naver-cafe" role="menuitem">
                <span class="share-option-badge share-badge-naver" aria-hidden="true"></span>
                <span class="share-option-label" data-i18n="share.option.naverCafe">네이버 카페</span>
              </button>
            </div>
          </div>
          <button type="button" class="header-icon-btn"
            data-url="https://chromewebstore.google.com/detail/bhmcpeaeeammcbcadpmkanfhfjklddkn/reviews"
            data-i18n-tooltip="tooltip.review" data-i18n-aria-label="review.title"
            data-tooltip="리뷰" aria-label="후기 공유하기">
            <span class="header-icon header-icon-review" aria-hidden="true"></span>
          </button>
          <button type="button" class="header-icon-btn" data-action="open-options"
            data-i18n-tooltip="tooltip.settings" data-i18n-aria-label="prefs.label"
            data-tooltip="설정" aria-label="환경설정">
            <span class="header-icon header-icon-settings" aria-hidden="true"></span>
          </button>
        </div>
      </header>

      <aside class="update-banner" data-role="update-banner" hidden>
        <span class="update-banner-icon" aria-hidden="true">✨</span>
        <div class="update-banner-text">
          <strong data-i18n="update.title">새 버전으로 업데이트되었습니다</strong>
          <span data-role="update-version"></span>
        </div>
        <button type="button" class="update-banner-dismiss" data-role="update-dismiss" data-i18n="update.dismiss">확인</button>
      </aside>

      <section class="settings-panel" aria-label="가사 다운로드 설정">
        <div class="settings-grid">
          <label class="field">
            <span data-i18n="field.format">다운로드 형식</span>
            <select data-setting="format">
              <option value="lrc">LRC</option>
              <option value="srt">SRT</option>
              <option value="txt">TXT</option>
            </select>
          </label>

          <label class="field">
            <span data-i18n="field.fileName">파일명</span>
            <select data-setting="fileName">
              <option value="title-song" data-i18n="fileName.titleSong">제목 + 곡 ID</option>
              <option value="title" data-i18n="fileName.title">제목만</option>
              <option value="song" data-i18n="fileName.song">곡 ID만</option>
              <option value="custom" data-i18n="fileName.custom">직접 입력</option>
            </select>
          </label>

          <label class="field field-wide" data-role="custom-pattern-field" hidden>
            <span data-i18n="field.customPattern">파일명 패턴 (변수: {title}, {songId}, {date}, {time})</span>
            <input type="text" data-setting="customPattern" placeholder="{title}-{songId}" spellcheck="false" autocomplete="off">
          </label>

          <label class="field field-wide">
            <span data-i18n="field.cleanMode">가사 정리</span>
            <select data-setting="cleanMode">
              <option value="none" data-i18n="cleanMode.none">원본 유지</option>
              <option value="basic" data-i18n="cleanMode.basic">기본: 섹션 줄, /, ~ 제거</option>
              <option value="strong" data-i18n="cleanMode.strong">강력: 섞인 [태그]까지 제거</option>
            </select>
          </label>
        </div>

        <div class="settings-footer">
          <label class="check">
            <input type="checkbox" data-setting="includeMeta">
            <span data-i18n="check.includeMeta">LRC/TXT에 제목과 곡 ID 포함</span>
          </label>
          <p class="status" data-role="status" data-i18n="status.idle">설정이 자동 저장됩니다.</p>
        </div>

        <div class="stats-row" data-role="stats-row" hidden>
          <span class="stats-icon" aria-hidden="true">📥</span>
          <span data-i18n="stats.downloaded">지금까지</span>
          <strong data-role="stats-count">0</strong>
          <span data-i18n="stats.unit">개 가사를 저장했어요</span>
        </div>

        <div class="quota-row" data-role="quota-row" hidden>
          <div class="quota-text">
            <span class="quota-label" data-i18n="quota.label">다운로드</span>
            <strong>
              <span data-role="quota-current">0</span><span data-role="quota-cap">/20</span>
            </strong>
            <span class="quota-boost" data-role="quota-boost" data-i18n="quota.boost">공유로 더 받기</span>
          </div>
          <div class="quota-bar" aria-hidden="true">
            <div class="quota-bar-fill" data-role="quota-bar-fill"></div>
          </div>
        </div>

      </section>

      <aside class="review-prompt" data-role="review-prompt" hidden>
        <span class="review-prompt-icon" aria-hidden="true">⭐</span>
        <div class="review-prompt-text">
          <strong data-role="review-prompt-title">다운로드 5개 돌파 🎉</strong>
          <span data-i18n="review.prompt.subtitle">이 확장이 도움됐다면 별점을 남겨주세요. 큰 힘이 됩니다.</span>
        </div>
        <div class="review-prompt-actions">
          <button type="button" class="review-prompt-leave" data-role="review-prompt-leave" data-i18n="review.prompt.leave">후기 남기기</button>
          <button type="button" class="review-prompt-later" data-role="review-prompt-later" data-i18n="review.prompt.later">나중에</button>
        </div>
        <button type="button" class="review-prompt-close" data-role="review-prompt-close" data-i18n-aria-label="review.prompt.close" aria-label="닫기">×</button>
      </aside>

      <section class="other-tools" aria-label="개발자의 다른 도구">
        <div class="section-heading">
          <strong data-i18n="tools.title">개발자의 다른 도구</strong>
          <span data-i18n="tools.subtitle">바로가기</span>
        </div>
        <div class="tool-links">
          <button type="button" data-url="https://playlistforge.com/">
            <span class="tool-icon tool-icon-forge" aria-hidden="true"></span>
            <span class="tool-copy">
              <strong>플리공장 <span aria-hidden="true">↗</span></strong>
              <span>Suno 자동화로 1000+곡 생성</span>
            </span>
          </button>
          <button type="button" data-url="https://tubeboost.kr/">
            <span class="tool-icon tool-icon-tube" aria-hidden="true"></span>
            <span class="tool-copy">
              <strong>튜브부스터 <span aria-hidden="true">↗</span></strong>
              <span>단 3초, 스마트 AI가 내 영상을 50+개 언어로 번역</span>
            </span>
          </button>
          <button type="button" data-url="https://comingsummer.kr/%ec%9c%a0%ed%8a%9c%eb%b8%8c-%ed%83%80%ec%9e%84%eb%9d%bc%ec%9d%b8-%ec%83%9d%ec%84%b1%ea%b8%b0/">
            <span class="tool-icon tool-icon-timeline" aria-hidden="true"></span>
            <span class="tool-copy">
              <strong>유튜브 타임라인 생성기 <span aria-hidden="true">↗</span></strong>
              <span>영상에 붙일 챕터 타임스탬프를 손쉽게 만들기</span>
            </span>
          </button>
          <button type="button" data-url="https://ieumpli.com/">
            <span class="tool-icon tool-icon-ieumpli" aria-hidden="true"></span>
            <span class="tool-copy">
              <strong>이음플리 <span aria-hidden="true">↗</span></strong>
              <span>음악을 듣는 모두와 만드는 모두를 잇다</span>
            </span>
          </button>
          <button type="button" data-url="https://cafe.naver.com/playlistforge">
            <span class="tool-icon tool-icon-cafe" aria-hidden="true"></span>
            <span class="tool-copy">
              <strong>플리공장 카페 <span aria-hidden="true">↗</span></strong>
              <span>AI 음악 제작 노하우 커뮤니티</span>
            </span>
          </button>
          <button type="button" data-url="https://open.kakao.com/o/gziXkYci">
            <span class="tool-icon tool-icon-chat" aria-hidden="true"></span>
            <span class="tool-copy">
              <strong>AI 음악 오픈채팅 <span aria-hidden="true">↗</span></strong>
              <span>SUNO AI 음악 제작자들의 실시간 대화방</span>
            </span>
          </button>
          <button type="button" data-url="https://open.kakao.com/me/playlistforge">
            <span class="tool-icon tool-icon-contact" aria-hidden="true"></span>
            <span class="tool-copy">
              <strong>개발자 1:1 문의하기 <span aria-hidden="true">↗</span></strong>
              <span>확장 프로그램 사용 문의와 피드백을 남겨주세요</span>
            </span>
          </button>
        </div>
      </section>
    </main>
    <div class="toast" data-role="toast" hidden></div>
    <script src="i18n.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
