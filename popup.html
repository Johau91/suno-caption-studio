<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Suno Caption Studio</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header>
        <strong>캡션 다운로드 설정</strong>
        <span>썸네일 버튼에 적용됩니다.</span>
      </header>

      <label class="field">
        <span>다운로드 형식</span>
        <select data-setting="format">
          <option value="lrc">LRC</option>
          <option value="srt">SRT</option>
          <option value="txt">TXT</option>
        </select>
      </label>

      <label class="field">
        <span>파일명</span>
        <select data-setting="fileName">
          <option value="title-song">제목 + 곡 ID</option>
          <option value="title">제목만</option>
          <option value="song">곡 ID만</option>
        </select>
      </label>

      <label class="check">
        <input type="checkbox" data-setting="includeMeta">
        <span>LRC/TXT에 제목과 곡 ID 포함</span>
      </label>

      <label class="field">
        <span>가사 정리</span>
        <select data-setting="cleanMode">
          <option value="none">원본 유지</option>
          <option value="basic">기본: 섹션 줄, /, ~ 제거</option>
          <option value="strong">강력: 섞인 [태그]까지 제거</option>
        </select>
      </label>

      <p class="status" data-role="status">설정이 자동 저장됩니다.</p>

      <section class="other-tools" aria-label="개발자의 다른 도구">
        <span>개발자의 다른 도구</span>
        <div class="tool-links">
          <button type="button" data-url="https://playlistforge.com/">
            <span class="tool-icon tool-icon-forge" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M12 3v18"></path>
                <path d="M5 8h14"></path>
                <path d="M7 16h10"></path>
                <path d="m17 5 2 3-2 3"></path>
              </svg>
            </span>
            <span class="tool-copy">
              <strong>플리공장 <span aria-hidden="true">↗</span></strong>
              <span>Suno 자동화로 1000+곡 생성</span>
            </span>
          </button>
          <button type="button" data-url="https://tubeboost.kr/">
            <span class="tool-icon tool-icon-tube" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M7 5.5v13l11-6.5-11-6.5Z"></path>
                <path d="M4 19h16"></path>
              </svg>
            </span>
            <span class="tool-copy">
              <strong>튜브부스터 <span aria-hidden="true">↗</span></strong>
              <span>단 3초, 스마트 AI가 내 영상을 50+개 언어로 번역</span>
            </span>
          </button>
          <button type="button" data-url="https://ieumpli.com/">
            <span class="tool-icon tool-icon-ieumpli" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M9 18V5l11-2v13"></path>
                <path d="M9 9l11-2"></path>
                <circle cx="6" cy="18" r="3"></circle>
                <circle cx="17" cy="16" r="3"></circle>
              </svg>
            </span>
            <span class="tool-copy">
              <strong>이음플리 <span aria-hidden="true">↗</span></strong>
              <span>음악을 듣는 모두와 만드는 모두를 잇다</span>
            </span>
          </button>
          <button type="button" data-url="https://cafe.naver.com/playlistforge">
            <span class="tool-icon tool-icon-cafe" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M5 6h14v10H8l-3 3V6Z"></path>
                <path d="M9 10h6"></path>
                <path d="M9 13h4"></path>
              </svg>
            </span>
            <span class="tool-copy">
              <strong>플리공장 카페 <span aria-hidden="true">↗</span></strong>
              <span>AI 음악 제작 노하우 커뮤니티</span>
            </span>
          </button>
          <button type="button" data-url="https://open.kakao.com/o/gziXkYci">
            <span class="tool-icon tool-icon-chat" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M4 6h16v10H9l-5 4V6Z"></path>
                <path d="M8 10h8"></path>
                <path d="M8 13h5"></path>
              </svg>
            </span>
            <span class="tool-copy">
              <strong>AI 음악 오픈채팅 <span aria-hidden="true">↗</span></strong>
              <span>SUNO AI 음악 제작자들의 실시간 대화방</span>
            </span>
          </button>
          <button type="button" data-url="https://open.kakao.com/me/playlistforge">
            <span class="tool-icon tool-icon-contact" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"></path>
                <path d="M4 21a8 8 0 0 1 16 0"></path>
                <path d="M17 10h4"></path>
                <path d="M19 8v4"></path>
              </svg>
            </span>
            <span class="tool-copy">
              <strong>개발자 1:1 문의하기 <span aria-hidden="true">↗</span></strong>
              <span>확장 프로그램 사용 문의와 피드백을 남겨주세요</span>
            </span>
          </button>
        </div>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
