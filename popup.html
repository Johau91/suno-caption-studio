<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Suno Caption Studio</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header>
        <strong>캡션 다운로드 설정</strong>
        <span>썸네일 버튼에 적용됩니다.</span>
      </header>

      <label class="field">
        <span>다운로드 형식</span>
        <select data-setting="format">
          <option value="lrc">LRC</option>
          <option value="srt">SRT</option>
          <option value="txt">TXT</option>
        </select>
      </label>

      <label class="field">
        <span>파일명</span>
        <select data-setting="fileName">
          <option value="title-song">제목 + 곡 ID</option>
          <option value="title">제목만</option>
          <option value="song">곡 ID만</option>
        </select>
      </label>

      <label class="check">
        <input type="checkbox" data-setting="includeMeta">
        <span>LRC/TXT에 제목과 곡 ID 포함</span>
      </label>

      <label class="field">
        <span>가사 정리</span>
        <select data-setting="cleanMode">
          <option value="none">원본 유지</option>
          <option value="basic">기본: 섹션 줄, /, ~ 제거</option>
          <option value="strong">강력: 섞인 [태그]까지 제거</option>
        </select>
      </label>

      <p class="status" data-role="status">설정이 자동 저장됩니다.</p>

      <section class="other-tools" aria-label="개발자의 다른 도구">
        <span>개발자의 다른 도구</span>
        <div class="tool-links">
          <button type="button" data-url="https://ieumpli.com/">이음플리</button>
          <button type="button" data-url="https://tubeboost.kr/">튜브부스터</button>
          <button type="button" data-url="https://playlistforge.com/">Playlist Forge</button>
        </div>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
